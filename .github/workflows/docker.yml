name: Docker Image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cursor-proxy

jobs:
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goarch: amd64
            artifact: cursor-proxy-linux-amd64
          - name: linux-arm64
            goarch: arm64
            artifact: cursor-proxy-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build UI
        run: |
          npm ci --prefix webui
          npm run build --prefix webui

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build executable
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.artifact }}" ./cmd/server
          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux executables
        uses: actions/download-artifact@v4
        with:
          pattern: docker-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare executables
        run: |
          chmod +x dist/cursor-proxy-linux-amd64 dist/cursor-proxy-linux-arm64
          ls -lh dist

      - name: Set up QEMU with Docker Hub retry
        shell: bash
        run: |
          image="docker.io/tonistiigi/binfmt:latest"
          for attempt in 1 2 3 4; do
            if docker pull "$image"; then
              docker run --privileged --rm "$image" --install arm64
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "QEMU image pull failed (attempt $attempt/4); retrying in $((attempt * 15)) seconds..."
              sleep $((attempt * 15))
            fi
          done
          echo "Unable to pull $image after 4 attempts." >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
