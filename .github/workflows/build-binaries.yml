name: Build Executables

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build UI
        run: |
          npm ci --prefix webui
          npm run build --prefix webui

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: build-ui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            artifact: cursor-proxy-windows-amd64.exe
          - name: windows-arm64
            goos: windows
            goarch: arm64
            artifact: cursor-proxy-windows-arm64.exe
          - name: linux-amd64
            goos: linux
            goarch: amd64
            artifact: cursor-proxy-linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            artifact: cursor-proxy-linux-arm64
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            artifact: cursor-proxy-macos-amd64
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            artifact: cursor-proxy-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build executable
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.artifact }}" ./cmd/server
          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/${{ matrix.artifact }}
